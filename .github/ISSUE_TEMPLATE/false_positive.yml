name: False positive
description: ctx-lint reported a problem that isn't one
labels: [false-positive]
body:
  - type: textarea
    id: snippet
    attributes:
      label: The exact snippet
      description: Paste the line(s) from your instruction file that triggered the report.
      render: markdown
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: ctx-lint output
      render: text
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why it's not a problem
      description: e.g. "it's an HTTP route, not a file path"
  - type: input
    id: version
    attributes:
      label: ctx-lint version
      placeholder: ctx-lint --version

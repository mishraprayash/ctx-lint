name: Release

# Publishes to npm when a version tag is pushed: `git tag v0.1.0 && git push origin v0.1.0`.
# The tag must match the version in package.json. Needs an `NPM_TOKEN` repository secret
# (an npm automation token). The package is published with provenance, which links it to this
# workflow run.

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the GitHub release
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile

      - name: Check that the tag matches package.json
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - run: pnpm verify
      - run: pnpm build

      - run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --title "${GITHUB_REF_NAME}" --notes-file <(node scripts/release-notes.mjs "${GITHUB_REF_NAME#v}")

      # `uses: mishraprayash/ctx-lint@v0` follows the latest 0.x release.
      - name: Move the major-version tag
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "${major}" "${GITHUB_REF_NAME}"
          git push -f origin "refs/tags/${major}"
